  oxp-11-office-purchase-seat-keying: done                     # CODE REVIEW COMPLETE, STORY DONE 2026-08-13. External Codex review (3-pass, high effort, CLI-direct via codex exec): 3 High, 2 Medium, 3 Low. 5 patched - own-office fallback could silently mute and edit ANOTHER holder's seat when holder_id is stale in a multi-seat office (now fails safe: muting requires a real holder match OR a genuinely single-seat category, disclosure note strengthened, edit control still works but never lies about which seat it targets); migration plan/apply gap could lose a concurrent write (now guarded by an updated_at optimistic-concurrency check before both the insert and the delete, refuses rather than embeds/loses data, reported as CHANGED, re-run picks up the fresh value); no documented safe deploy/migration cutover order (addressed via a prominent operational warning in the migration script's own header rather than runtime dual-schema code, since both live documents currently hold nothing but {"Safe Place": 0} - logged to deferred-work.md as an accepted-for-now risk); migration silently treated an orphaned seat-shaped key as already-migrated (now refused and reported under a new refused-orphaned-seat-key action); the story's own "no em-dashes in comments/tests" line overstated CLAUDE.md's real scope (dismissed against hard evidence - oxp-1's story alone has 67, oxp-2's has 97 - and corrected). 2 findings resolved by direct confirmation: DB-backed totals Codex's own sandbox couldn't verify (EACCES, same pattern as otc-2/oaq-2/oxp-1/oxp-2/oxp-3/oxp-4) re-run here with working DB access - 188/188 required six-file gate, 79/79 adjacent regression; and confirmation this session never ran the migration script's --apply against anything either. All 5 patches prove-discriminated by single-change revert. 8 new tests. Live tm_suite never touched throughout the whole story. IMPLEMENTATION NOTE FOLLOWS. Both purchase collections are now SEAT-keyed (_id = office_seats._id as a 24-hex string, plus a denormalised self-healing office_category that is never the key and never authoritative). One shared resolver, server/lib/office-seat-resolve.js, turns :seatId into a seat for both routes: 400 on a malformed id, 404 on an unknown seat, 400 on a seat whose office has no OFFICE_DATA entry (Administrator, until oxp-8). The manoeuvre step route keeps its atomic aggregation-pipeline findOneAndUpdate and its [0, manoeuvres.length] clamp; office_category rides in the existing second $set as a $literal so it composes with the upsert path. Client: office-tab.js gained _wirePurchaseState, ONE GET /api/office_seats per render pass feeding both wiring functions, holder match for your own office, deterministic fallback (ascending created_at then _id) otherwise, an on-screen note naming the seat whenever the category has more than one, and explicit no-seat / seats-unavailable states instead of a plausible row of zeros. Migration script server/scripts/migrate-office-purchases-to-seats.mjs is dry-run by default, idempotent, insert-then-delete, and REFUSES both the no-seat and the ambiguous multi-seat cases rather than guessing; NOT YET RUN against live tm_suite, which is Angelus's action. Tests: 187 passed across the 4 reworked suites plus the new oxp-11 suite and the two adjacent ones, 0 failed; the pre-existing oxp-1-office-seats.test.js load failure (the shebang in seed-office-seats.mjs) is unchanged and untouched. Prove-discrimination run on both load-bearing gates. ORIGINAL STORY NOTE FOLLOWS. STORY CREATED 2026-08-13. Migrates office_merit_dots and office_manoeuvre_ranks from category-keying (_id: 'Primogen', ONE document per office) to SEAT-keying (_id: the seat's own office_seats._id as a 24-hex string), so Primogen's two live seats (Yusuf Kalusicj, Rene St. Dominique) and Socialite's two (Brandy LaRoux "Harpy", Carver "People's Harpy") can hold independent purchase state. This gap was flagged and deliberately deferred THREE times - oxp-1's Finding 3, oxp-3's "What this story is NOT", oxp-4's scope notes - each on the correct grounds that neither multi-seat office had actually had a real purchase yet. WHAT CHANGED: the gap became a hard blocker while scoping oxp-5 (handover/reset). A read-only consumer like oxp-2 could punt gracefully with spendKnown:false; a WRITE path cannot, because resetting the single shared Primogen manoeuvre document on one seat's handover would also wipe the OTHER seat's unrelated progress. Angelus's ruling, asked directly (2026-08-13): "then so something like code them as Primogen 1 and Primogen 2, treat each of them as a unique seat that wipes independently" - full migration, not a multi-seat carve-out or exclusion list. Scope call, also his: BACKEND PLUS MINIMAL CLIENT WIRING ONLY. Explicitly NOT a new seat-picker UI letting an ST browsing Primogen as reference choose WHICH seat to look at - that is real UI work belonging to oxp-6, which has not been built even for today's category-only model. LIVE DATA RE-CONFIRMED read-only for this story 2026-08-13: office_merit_dots still holds exactly 2 documents (Enforcer, Head of State, both SINGLE-seat offices so each maps unambiguously to one seat), and both contain exactly {"Safe Place": 0} - there is NO non-zero purchase data anywhere in either collection, so the real data-loss risk in this migration is near zero and the story says so rather than overstating it. office_manoeuvre_ranks is still completely empty (0 documents), so nothing to migrate there beyond the schema/route change. All 7 office_seats documents still match exactly one character by holder_id, with no orphans in either direction, so the client seat resolution will succeed for every real holder on the day this ships. ARCHITECTURAL CHECK, done rather than assumed: re-keying by seat _id PRESERVES oxp-4's proven merits-persist-across-handover guarantee server-side rather than breaking it, because a seat's _id is minted once and never changes while a handover moves only holder_id, which is never copied into either purchase collection. BUT the analysis surfaced a genuinely NEW client-side dependency the original framing did not have: office-tab.js must now resolve WHICH seat the viewer's office is, and the only signal is office_seats.holder_id matching char._id - and NOTHING in this codebase currently maintains holder_id (oxp-1's one-off seed script is its only writer; oxp-5 is unbuilt). So after a real handover, characters.court_category updates through the real character route while office_seats.holder_id silently goes stale. Costs nothing for a single-seat office (the deterministic fallback lands on the only candidate anyway) but could resolve to the WRONG seat for a multi-seat one, which is why the story requires the resolved seat to be NAMED on screen whenever a category has more than one seat, instead of silently picking one and letting an ST edit the wrong Primogen's dots with a stepper. This makes "oxp-5 must write holder_id when a seat changes hands" a hard requirement of oxp-5, recorded here so it is not rediscovered. 10 ACs: seat-keyed document shape with a denormalised, self-healing, never-authoritative office_category copy (no AJV schema file added - neither collection has ever had one, routes are the validation surface); both routes re-keyed to :seatId with three distinct failure codes (malformed id 400, unknown seat 404, seat whose category has no OFFICE_DATA entry 400, preserving oxp-3's existing Administrator test expectation); oxp-3's atomic aggregation-pipeline step route and its clamp preserved intact through the re-keying; a manual dry-run-by-default migration script mirroring seed-office-seats.mjs's conventions that REFUSES rather than guesses on a zero-seat or ambiguous multi-seat category, and does insert-then-delete (since _id is immutable) so an interrupted run leaves both documents rather than neither; client resolution by holder plus a deterministic created_at-then-_id fallback with the multi-seat disclosure note and an explicit no-seat state; FOUR existing test suites reworked not supplemented; the flagship independence proof (two Primogen seats holding different purchases, proved for both collections - Primogen is the harder case and is required because both its seats carry an identical court_title and a null seat_label, so nothing but document identity separates them); oxp-4's handover guarantee re-proved end to end under the new keying; and a comments-only update to office-xp.js's now-obsolete spendKnown rationale, with the flag's LOGIC deliberately unchanged because it fails safe and flipping it would rewrite oxp-2's AC8 from inside this story. FOURTH AFFECTED TEST SUITE FOUND during story creation, not named in the original scoping: server/tests/oxp-4-merit-persistence-handover.test.js PUTs to /api/office_merit_dots/Enforcer throughout and carries a source-contract block asserting the client wiring contains no char/_id/holder token at all, which the new seat resolution interacts with directly; the correct restatement is that no character id ever reaches the purchase API and no holder_id is ever stored in a purchase document, while the client legitimately reads office_seats.holder_id to choose a seat - do not weaken it into vacuity to make it pass. Also NOT in scope: the pre-existing merit-dots lost-update race (stays in deferred-work.md, orthogonal to seat identity, and folding it in would blur what this migration's tests prove), oxp-5's reset logic, any office_seats change, oxp-9's spend-approval routing, oxp-10's OFFICE_DATA migration. Note for the dev agent: do NOT give the new migration script a #!/usr/bin/env node shebang - the one in seed-office-seats.mjs is what makes all 41 of oxp-1's tests fail to load under the current vitest. Story: oxp-11-office-purchase-seat-keying.md

