  oxp-3-manoeuvre-purchase-graduated-merit: done              # REVIEWED AND DONE 2026-08-13, merged to main via PR #1158. External Codex review (3-pass isolated, high effort) against the review state: 0 High, 5 Medium, 4 Low, every finding independently reproduced before patching. 3 Medium patched - (1) fail-open manoeuvre list on a rejected rank fetch (the synchronous render deliberately mutes nothing while the rank is unknown, so a silent failure left the holder looking at five active manoeuvres; the list is now replaced with a Could-not-load-purchase-state message, matching _wireMeritDots's own catch idiom in the sibling section); (2) stale-category repaint - an adjustment resolving after a category switch re-queried the tab root and painted the OLD office's rank, controls and rows into the NEW one's markup; closed with a render-generation counter on el itself (el._officeManoeuvreGen, bumped in renderOfficeTab, captured before the first await, checked before every DOM write and before the post-write re-render), adapting office-approvals.js's module-scoped _fetchGen precedent to an element that is re-rendered repeatedly; (3) lost-update race on concurrent stepper clicks - _adjustManoeuvreRank did a client-side read-compute-write, so two overlapping adjustments both read the same rank and both wrote the same next value; fixed SERVER-side with a new atomic PUT /:category/step (requireRole('st'), body {delta}) doing increment + [0, manoeuvres.length] clamp in one aggregation-pipeline findOneAndUpdate with upsert, and the client now sends only the signed delta. The absolute-set PUT /:category is kept deliberately (set-to-exactly-N has correct last-writer-wins semantics; only the stepper needed the relative form). 1 Medium ruled NOT a bug by Angelus - an ST/dev seeing the rank readout while browsing a reference office is intended, matching the Merit Suite's already-shipped isOwnOffice-independent stepper and the set-up-before-handover case AC6 was written for; AC2 clarified to state it governs the MANOEUVRE LIST (unchanged, and structurally clean: the muted class is never emitted in reference view at all, so a browsing player's DOM carries no purchase state), the readout being AC6's widget with a deliberate ST/dev exemption. 1 Medium (all-8-ACs claim overstated without AC7's concurrency outcome) closed by patch 3; AC7 rewritten off the re-fetch-before-write pattern it originally mandated, since that pattern was itself the defect. 2 Low patched (clamp inside the exported manoeuvreRankHtml, which threw RangeError on a negative rank; five-existing-tests miscount corrected to four), 1 Low superseded by 3 new fake-DOM tests driving the real async wiring end to end (no jsdom in this project - same hand-rolled technique as otc.3's fake <select>, with localStorage and fetch stubbed the way this file's header already stubs location), 1 Low dismissed as environmental: Codex's 9-files/107-passed/49-skipped gate result came from a wrong filename in the reviewer-supplied command (tests/oaq-2-pending-status-actions-accept-decline.test.js, real file tests/oaq-2-pending-status-actions.test.js) plus Mongo EACCES from an orphaned concurrent codex exec process; after killing it and correcting the filename the same gate re-ran clean at 171/171 across 10/10 files, matching the dev round - same transient-reachability pattern already recorded in otc-2/oaq-2, both readings accurate for their own moment. All 3 fixes prove-discriminated by single-change revert (2 / 1 / 3 expected failures respectively, nothing else moving; fix 3 verified over three consecutive runs, its concurrency test firing FOUR simultaneous steps rather than two because two racers did not reliably interleave). Final regression 186/186 across 10 files, zero skipped, up from 171. No unresolved High/Medium. Story: oxp-3-manoeuvre-purchase-graduated-merit.md
