argeted gate (now eight files): 217/217, 0 failed, 0 skipped. Full finding-by-finding triage at specs/stories/code-review/oxp-5-codex-findings.md.
  oxp-6-office-tab-purchase-markers: done                     # CORRECTED 2026-08-15: this line said "backlog", stale against the branch's own story file (Status: done) and commit (feat(office-tab): oxp-6 purchase and affordability markers). Dev + review complete on ms/oxp-6-office-tab-purchase-markers. STILL NOT COMMITTED TO MAIN, NOT merged - held under Epic OTC's own standing order (hold all remaining merges until the epic ships), same posture as oxp-5. HARD REQUIREMENT HANDED FORWARD BY oxp-5 (2026-08-13), do not rediscover this the hard way: officeXpSpentForCategory in public/js/data/office-xp.js MUST add office_manoeuvre_ranks.manoeuvre_xp_destroyed to its spend total BEFORE any balance is rendered anywhere. Office spend is DERIVED from current state (current merit dots + current manoeuvre rank), so oxp-5's handover reset drops the derived spend by the destroyed rank and RAISES the balance by exactly the amount content/rules/office-powers.md says is gone - a refund, which the ruling forbids explicitly ("the running balance is total accrued since creation, minus everything ever spent, INCLUDING THE SPEND THAT HAS SINCE BEEN LOST"). oxp-5 stores the cumulative counter and deliberately does not consume it, because office-xp.js has no consumer yet so nothing is wrong on screen today, and wiring it there would have rewritten oxp-2's AC8 from inside oxp-5. The counter cannot be recomputed from anything at any later time by any means - it is destroyed by definition and exists nowhere else - so if a balance ships without it, the number is simply wrong and there is no way to detect it after the fact. LIMITATION INHERITED FROM oxp-11 (2026-08-13): an ST or dev browsing a MULTI-SEAT office they do not hold (Primogen, Socialite) sees ONE of its seats' purchase state, chosen by a deterministic fallback (ascending created_at then _id), and can edit it with the stepper. oxp-11 ships an on-screen note naming which seat is on screen, which makes that survivable rather than dangerous, but it is a label and not a picker - Angelus scoped oxp-11 as "backend plus minimal client wiring only". A real seat picker belongs HERE, and oxp-6 will need one for its own reasons anyway. Full reference list, unpurchased greyed/muted (reuse .pointed.hollow). Distinguish "no pool XP" from "rank not reached" via reason on tap/hover, not one visual state. SCOPING SESSION 2026-08-13 (while oxp-5's dev-story ran, ahead of ACs): investigated office-tab.js's real current state - _wireMeritDots/manoeuvreRankHtml still hand-build raw Unicode dots, not the codebase's standard .pointed/.pointed.hollow CSS dots (components.css:55-56) that Merit Suite and attribute/skill rows already use; NOTHING in office-tab.js computes affordability today, it is a pure ST admin stepper wholly disconnected from office-xp.js's balance functions. ANGELUS'S RULING, asked directly: the seat picker and the new purchase/affordability markers stay HOLDER-OR-ST-ONLY. otc.3's explicit privacy design ("a reference viewer's DOM carries no purchase state at all") is NOT widened by this story - a player browsing another office as reference keeps seeing the existing plain, unmuted, purchase-state-free summary; nothing new here is visible to them. The seat picker itself is therefore an ST/dev tool for choosing which of a multi-seat office's seats to view/edit as reference, not a self-identification aid for an uncertain holder - and note that need shrinks going forward once oxp-5 ships, since every future handover then keeps holder_id current and the deterministic-fallback ambiguity oxp-11 flagged mostly stops recurring for NEW handovers (it can still bite on any seat whose holder_id predates oxp-5, which is none of the 7 live seats per oxp-11's own read-only check). HARD DEPENDENCY ON oxp-5's Finding 1: distinguishing "no pool XP" from "rank not reached" requires a real balance, and oxp-5's manoeuvre_xp_destroyed counter has to be added into office-xp.js's officeXpSpentForCategory before that balance is honest - oxp-5's own Dev Notes name oxp-6 (or oxp-7) as the first real consumer required to do this wiring, so it is IN this story's scope, not assumed pre-done. Dev-story should not start until oxp-5 is merged to main.
