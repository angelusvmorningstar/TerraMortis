pcr classes the deleted tab used are also used by npc-register.js, relationship-editor.js, edit.js and downtime-form.js. Cross-repo cleared: TM Wiki does not consume TM Suite CSS, and nothing anywhere consumes /api/tickets. EXTERNAL REVIEW (Codex, 3-pass adversarial) 2026-08-11: 0 High, 7 Medium, 9 Low. AC15 was GENUINELY FALSE as first implemented - five live tests in feat-16-17-fix44-tracker-feeding.spec.js drove goTab(rules) and waited on the deleted #t-rules; the original verification only ran the four spec files the story itself named and never swept the suite for the eight deleted ids. Converted rather than retired (they cover rules CONTENT, which survives behind openRulesOverlay), 5 failed -> 5 passed. Checking where the reviewer disclosed a gap found two MORE latent stale assertions in post-game-1.spec.js that it had declined to attribute - fixed. A FIFTH registration point was also missed by the original analysis: the Settings tab still advertised and toggled the three deleted Lore tabs; the hint is corrected (the font-size control itself is still live) and the dead toggle, its handler and both now-unreachable guide filters are gone. Three record claims were corrected: CSS counts (84+85 blocks, not 79+85), the desktop baseline (a flaky test, so neither 13/7 nor 12/8 is stable - what holds is the unchanged failure set), and the npcr- evidence command (returns 1, not 0, because the diff adds a comment; the rule-level protection is sound). Five further stale comments fixed, three stale docs corrected (system-map, reference-data-ssot, epic-city-refresh) plus adm.2-spheres.yml annotated. AC8 gained a regression guard (server/tests/tickets-removed.test.js, static, needs no DB). Review INDEPENDENTLY CONFIRMED the discrimination run (8/4 vs 12/12 exact), the npcr- rule protection, brace balance, Herald /api/devlog still mounted, a real 404 from /api/tickets, and that all 12 new tests have same-test positive controls. Deferred: 3 pre-existing dead _svg entries, no coordinator fixture, and two pre-existing broken harnesses (#n-more and #btn-desktop-toggle, both confirmed broken at base). Post-patch: 19 passed (3 primary specs), 5 passed (feat.17), 56 passed (server, real runs). POST-REVIEW: the tickets COLLECTION (69 docs) was dropped 2026-08-11 on Angelus's explicit authorisation, as a separate action AFTER the review closed - the story itself shipped code-only as specified. Drop was guarded on live count matching the export (69=69); recovery path is data/exports/tickets-full-export-2026-08-11.json. The 19 open tickets (real unfixed bugs) were deliberately NOT converted to GitHub issues - Angelus declined. MERGED AND DEPLOYED 2026-08-11: commit b8094fd5 -> PR #1136 -> main d6f641d7, issue auto-closed, Netlify + Render deployed from main. Story: issue-1135-delete-eight-tabs.story.md

