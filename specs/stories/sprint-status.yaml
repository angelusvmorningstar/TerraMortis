LL IMPORTANT: the seed script has NEVER been run for real, by anyone, in either the dev session or the review round, and the live tm_suite database was never connected to or written to - every DB-touching test went through the vitest harness, whose tm_suite_test forcing was re-verified by reading the chain (vitest.config setupFiles -> setup-env.js -> assertTestDbSafety pre-connect -> setupDb post-connect recheck) rather than assumed. RENE'S DATE NOW CONFIRMED (2026-08-13): both live Primogen seats were created Game 1 (2026-02-21), same as Yusuf Kalusicj's - neither is "original" vs "later addition". Yusuf has only HELD his seat since Game 5 (a real prior handover, untracked by this holder-only collection, and irrelevant to the seat's own creation date). Only docs updated (seed script header, story seat table); RENE_PRIMOGEN_SEAT_CREATED_AT stays null in source, --rene-created-at=2026-02-21 is the confirmed value to pass at run time. Seed script still not run for real; that is Angelus's action to take, not an agent's.
