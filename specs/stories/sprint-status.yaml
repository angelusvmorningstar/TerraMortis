  fix-525-ordeals-submit: review  # Players can't start/submit ordeals. ROOT CAUSE: POST /api/ordeal-responses gated by validate(ordealResponseSchema) whose required:['ordeal_type'] (ordeal.schema.js:79-96) describes the STORED doc, but the request body is {type,responses} (ordeal-form.js:45/78; handler reads `type`, stores ordeal_type). Missing required ordeal_type -> AJV 400 on EVERY create. Schema imported ONLY by that POST, so fix is request-only: add `type` enum property + required:['type'] (drop required ordeal_type), keep responses/object + additionalProperties. End-to-end POST->PUT(submit)->GET then works. Slipped through because ordeal_responses had NO test (only ordeal_submissions did) — add api-ordeal-responses.test.js. Server change, not testable on dev until main. Issue #525
  feature-522-carthian-pull-status-dots: review  # Generalise Carthian Pull from 1 dot to N = Carthian (Covenant) Status (c.status.covenant['Carthian Movement'], 0-5). Builds on #508/#510 single-dot. Endpoint PATCH /:id/carthian_pull changes single {target,sphere} -> set {allocations:[...]}; server reads N from the character (not client-trusted), rejects count>N, strip-then-apply generalised over the set (multi free_carthian increments; Contacts carthian_sphere marker -> plural list for clean strip; schema add). Multi-row form UI (up to N rows, "X of N" counter) reworking renderCarthianPullSection/_writeCarthianAllocation; preserve #512 failure toast + caps (Allies/sphere<=5, Contacts<=5 spheres no dupes). Channel infra (free_carthian) already exists from #508 - no channel work. dev-fixtures carthian_pull handler mirror. Open Qs (in story): stacking same merit/sphere? (recommend allowed), over-cap reject vs drop (recommend reject), per-cycle cadence (recommend yes). Server change so not testable on dev until main. Issue #522
  feature-508-carthian-pull-allocation: review  # EXPANDED to sheet bonus dot. Single-dot Carthian Pull, allocate to Allies/Contacts/Haven/Herd. NOW writes a free_carthian bonus dot LIVE to the character (player-scoped PATCH /api/characters/:id/carthian_pull, #506 ownership pattern) so it shows on the sheet via the existing free_* model; strip-then-apply (one bonus max, granted_by:'Carthian Pull'); bonus-only merit instance created for Allies/Contacts + absent targets. Cross-cutting: free_carthian added to schema + normalize MERIT_CHANNELS/GRANTED_BY_CHANNEL + meritFreeSum + meritEffectiveRating + domMeritContribSingle. DT form: section before Feeding, live write, re-derive Allies/Contacts arrays from currentChar.merits (NO synthetic slot — bonus merit drives the one slot, no double-up), cap-disable at 5; Herd +1 falls out of effectiveDomainDots reading free_carthian (no special-case). 4 phases (channel infra / endpoint / DT form / tests). Issue #508
  feature-506-persist-safe-place-locations: review  # persist safe-place locations on the character (merits[].location, new schema field) so they carry between cycles; needs NEW player-scoped PATCH /api/characters/:id/safe_place_locations (existing PUT is ST-only) with character_ids ownership gate; store on merit object NOT a domKey-map (sidesteps feature.504 domKey-collision); write on submit only (not autosave); renderer pre-fill precedence saved ?? sp.location; dev-fixtures interceptor handler needed; follows issue #506
  tech-debt-497-cycle-id-objectid-fk: review  # downtime_submissions.cycle_id stored as both string (DT1) and ObjectId (DT2+); type-strict BSON find({cycle_id: activeCycle._id}) silently drops string-typed subs. Most read sites ALREADY dual-type tolerant (#496/#257); genuine bug is ONLY the feeding-rights lock check at territories.js:117-120 (no tolerance + wrong comment claiming 496.3 OID-normalised cycle_id — it only did responses.* territory keys). Scope: (a) lock-check dual-type $in fix + comment correction, (b) PUT cycle_id/character_id coercion (POST already coerces 619-628), (c) schema tolerance comment, (d) grep-sweep + sibling FK audit (character_id already coerced+dual-read; project_invitations.cycle_id String by own convention=out of scope), (e) read-only audit script + one-time migration script (dry-run/backup/idempotent/safety-abort, modelled on migrate-submission-territory-keys.js) — USER runs both against live. Tests in tm_suite_test. Distinct from #496. Issue #497
  chore-581-merge-dt-proto-dev: review  # merge ms/dt-processing-proto (13 commits, never pushed) into dev. KEY FINDING: not a standalone app — dt-proto.html is a dev harness (fetch shim + gitignored dt-proto-data fixtures); the real work is in shared public/js/admin/downtime-views.js which the live admin app already imports (admin.js:27) and which already reads live prod data via /api/* (netlify.toml:17-19 -> tm-suite-api.onrender.com) behind ST auth. So the merge ITSELF lands proto.1-16 in the live /admin DT view against real data; no "rewire" needed (corrects issue #581 framing). Zero server/ changes -> fully dev-testable (unusual). DECISIONS RESOLVED 2026-06-05: (1) KEEP dt-proto.html+boot untouched as a permanent OFFLINE PLAYGROUND (experiment without API/auth; fixtures+shim are the feature, dev-only); (2) proto REPLACES the existing DT view so conflicts on downtime-views.js + admin-layout.css resolve in proto's favour, BUT preserve dev's 2 newer non-DT commits post-5b033c3 + union sprint-status; (3) dev-only. Issue #581
  feature-583-investigate-lead-card: review  # RENDER-ONLY. Show the player's investigation lead on the DT Processing project Details card (Title / Lead / Description). Data ALREADY plumbed to the card entry as entry.projInvestigateLead (downtime-views.js:3109, from form key project_N_investigate_lead); just never drawn — card view mode (downtime-views.js:8847-8858) shows Title/Desc/XP only, lead was deliberately stripped (comment :8802). Fix: add a Lead row after Title gated on entry.actionType==='investigate' && entry.projInvestigateLead, reusing proc-proj-field/proc-feed-lbl (no new CSS). Read-only (lead is a player fact like the pool); ST-editable variant (rev.investigate_lead + save wiring) OUT of scope. Merit/sphere/status investigate leads (different card) out of scope. Branch morningstar-issue-583-investigate-lead-card off dev. Issue #583
  fix-586-target-prepopulate: review  # THROUGHLINE. DT Processing target picker ignores the player's submitted target (Einar->Ryan Ambrose shows nothing). Audit: investigate (downtime-views.js:6986) + attack (:7023) seed from rev.*_target_char ONLY; sorcery (:7032) correctly falls back to player targets; block has a form target_char but NO picker rendered at all. Player target stored as responses.<prefix>_target_value (char _ids) + _target_type, parsed by _composeTargetString (:2739); typeahead keyed by sortName(c) (_renderCharTypeahead :7062). Fix: compute entry.targetCharKeys (id->sortName) in buildProcessingQueue, seed each single picker OVERRIDE-AWARE via ('field' in rev) check (NOT ?? / || — single save writes null on clear, so ?? would re-seed after an ST clear; ST override must win). Critical path = CHARACTER target for investigate+attack; territory/other surface via entry.projTarget display (AC5); block needs a picker added. Playwright per #583 harness. CSS is separate (#587). Branch morningstar-issue-586-target-prepopulate off dev. Issue #586
  tech-debt-585-flat-wall-test-repair: review  # TEST-ONLY. Repair tests/downtime-processing.spec.js for the #581 flat card wall. 13/16 fail because the suite's openFirstAction (:201-215) drives the removed accordion DOM (.proc-phase-section/.proc-phase-header/.proc-phase-toggle); the main queue is now FLAT .proc-action-row -> .proc-action-detail (downtime-views.js:4678-4715), phase nav moved to filter-bar pills (.proc-filter-pill[data-filter-dim=phases][data-filter-val=<PHASE_LABELS key>], renderProcFilterBar :4513). .proc-phase-section survives ONLY for XP Review (:4191) + Deleted (:4141). Fix: replace openFirstAction with a flat opener (click .proc-action-row by TEXT — queue also emits a Feeding row so .first() is unreliable; model tests/fix-586-target-prepopulate.spec.js), rewrite the phase-routing test (:241) via phase filter pills. NO product code changes (AC4). Branch morningstar-issue-585-flat-wall-tests off dev. Issue #585
  feature-587-admin-css-token-normalise: review  # CSS-ONLY, all admin surfaces. 3 problems (Angelus): (1) .dt-btn uses background:var(--surf) so buttons vanish on darker --surf2/--surf3 panels — need separation on dark parchment; (2) pressed/active should be SOLID dark gold (background:var(--gold2);color:var(--bg)) reusing the .dt-ticker__pill:has(input:checked) Blood-Type idiom; (3) fill-in inputs read dark — base .proc-conn-input is light (var(--bg) admin-layout.css:6565) but .proc-targeting-group .proc-conn-input overrides to --surf2 (:6532); plus target-chip spacing in DT form. CRITICAL nuance: do NOT flatten the semantic state chips (.proc-rote-chip crim / .proc-again-opt gold / .proc-roll-mode-btn green-gold-grey, :5046-5048/:5078-5080) — pressed-gold is for GENERIC .dt-btn family only. Tokens only (no bare hex), both light+dark theme blocks (theme.css:13-28/:176+). Behaviour work is #589/#590, not this. Branch morningstar-issue-587-css-token-normalise off dev. Issue #587
  fix-595-roll-validate-gate: review  # BLOCKS ROLLING. Roll card shows "Validate pool first" while the ribbon reads "Valid". Traced: (1) PRIME BUG downtime-views.js:5277 hasRoll=!!(rev.roll) — rev.roll is the roll RESULT, so Player Pool/ST Override only set pool_status='validated' when ALREADY rolled (backwards); fresh action never validates. Fix: gate on a POOL existing (rev.pool_validated / entry.poolPlayer), not a roll result. (2) ribbon _deriveActionRibbonState(:8084) returns 'valid' for ANY non-pending pool_status, but _showRollBtn(:7621) only accepts {pending,confirmed,rolled,validated} -> non-listed non-pending (resolved/no_roll) => "Valid" + disabled roll dead-end; reconcile to one predicate. GOTCHA: 'validated' is in DONE_STATUSES(:273) which guards the validate branch (!DONE_STATUSES.has(curStatus)). Likely #581/proto.4 roll-mode regression. Repro+capture real pool_status first. Playwright per #586 harness. Branch morningstar-issue-595-roll-validate-gate off dev. Issue #595
  fix-594-dossier-target-read: review  # SIBLING OF #586. The "This Cycle" dossier _renderSnapshotTargetIntel (downtime-views.js:8724-8735) reads rev.investigate_target_char / attack_target_char ONLY, so it shows "Target not set" while the picker shows the player-seeded target. Fix: seed targetName override-aware via ('field' in rev) ? rev[field] : entry.targetCharKeys?.[0] (mirror #586; NOT ||/?? — ST clear must win). entry.targetCharKeys is already sortName keys = exactly the format the downstream match (:8739-8744) needs, no conversion. Investigate+attack. Decision: seed (message becomes accurate) not drop. Playwright per #586 harness. Branch morningstar-issue-594-dossier-target-read off dev. Issue #594
  feature-601-maintenance-target-details: review  # MAINTENANCE family of #583/#586. Player picks the maintained asset (Professional Training/MCI) via the maintenance chip -> stored in responses.project_N_target_value as `${m.name}_${dots}` (downtime-form.js:5583), NO target_type. DT Processing Details card never shows it. DECISION: Option B (resolve name in processing), NOT Option A (set target_type='own_merit') — stored value is Name_dots not Name|qual, so _composeTargetString own_merit branch (:2759) would render the ugly "Professional Training_5". Fix: compute entry.maintenanceTarget in buildProcessingQueue (match target_value vs char MAINTENANCE_MERITS -> m.name; fallback strip trailing _<digits>), gated effectiveActionType==='maintenance' (target_value also = char target for attack/block/investigate, don't collide). Render a Target row in renderNormalisedCard view mode after Title (like #583 Lead row, reuse proc-proj-field, +empty-state guard). Playwright per #586 harness. Branch morningstar-issue-601-maintenance-target-details off dev. Issue #601
  feature-589-connected-chars-flow: review  # #586 THROUGHLINE for Connected Characters. AUDIT: player DT form has NO connected-chars capture (grep 'connected' in downtime-form.js = nothing); ST _renderCharTypeahead(connected_chars) at downtime-views.js:7115 is ST-input-only. So TWO-PART: (1) player capture + (2) override-aware ST seed. SCOPE DECISION (Angelus 2026-06-05): PER PROJECT ACTION ONLY (sphere/contact/retainer stay ST-manual, future). Player: multi-char selector on project action card -> responses.project_N_connected_chars (JSON array of _ids, mirror target_value convention). Queue: entry.connectedCharKeys via _composeTargetCharKeys-style id->sortName map (:2776), near _projTargetCharKeys (:3074), project entries only. ST seed (:7115): ('connected_chars' in rev) ? rev.connected_chars : entry.connectedCharKeys (presence check NOT ||/?? — typeahead writes []/null on clear). Exclude actor (:7119 filter). Playwright per #586 harness. Branch morningstar-issue-589-connected-chars-flow off dev. Issue #589
  feature-599-flock-herd-display: review  # Vitae Tally: show "Herd (Flock) +n (+x)" when flockHerdBonus(c)>0 (+n total, +x Flock portion). AUDIT: the two sides compute Herd DIFFERENTLY — ST downtime-views.js:7760 herdVitae=domMeritContrib (INCLUDES ssj+flock, :42); render :7846-7847 (only add label/value strings, do NOT re-add flock = double count). Player downtime-form.js:6997 herdDots=effectiveDomainDots (:357-365 = meritEffectiveRating ONLY, EXCLUDES flock AND ssj) -> posMod :7076, render :7089; MUST add flockHerdBonus(c) to the total for AC2. Over-cap not clamped (AC3). FLAG out-of-scope: player effectiveDomainDots also drops ssjHerdBonus (pre-existing under-count) -> separate follow-up issue, do NOT fix here. Playwright ST per #601 harness (fixture needs a Flock merit). Branch morningstar-issue-599-flock-herd-display off dev. Issue #599
  feature-590-confirmed-pool-spec-name: review  # Confirmed pool should name the spec (e.g. "Coward Punch (Stealth)"). AUDIT: .proc-pool-total initial render uses initTotalStr = bare base (NO spec names) at downtime-views.js:9078/9724/9819; runtime recalc (:6973) DOES augment via _augmentPoolWithSpecs but a CONFIRMED pool is disabled + never recalcs -> stays bare = the bug. Also _augmentPoolWithSpecs (:795-804) names specs but LACKS the (Skill) qualifier for cross-skill IS specs. FIX: (1) add (Skill) qualifier in _augmentPoolWithSpecs via isSpecs(char) [{spec,fromSkill}] mirror _buildSpecTogglesHtml (:6614-6623); (2) wrap initTotalStr with _augmentPoolWithSpecs(initTotalStr, rev.active_feed_specs||[], char) at feeding+project sites. Source = rev.active_feed_specs (name strings); helper early-returns unchanged when no specs + recomputes total (don't double-count). Scope feeding+project, NOT sorcery (:7619). Playwright per #601 harness. Branch morningstar-issue-590-confirmed-pool-spec-name off dev. Issue #590
  tech-debt-602-feature96-flat-wall-repair: review  # TEST-ONLY. Sibling of #585. feature96.spec.js openFirstAction(page, phaseLabel) (:208-219) drives removed accordions (.proc-phase-section/-header/-toggle) -> hangs. GOOD NEWS: assertions still valid — tests the pool-status ribbon (.proc-status-ribbon/.proc-ribbon-step.ribbon-active.<pending|confirmed|rolled>) which is INTACT (downtime-views.js:7186-7199). So OPENER-ONLY swap: mirror #585 openActionInPhase (downtime-processing.spec.js:206-211) = filter pill [data-filter-dim=phases][data-filter-val=<key>] + .proc-action-row first + wait .proc-action-detail. Map label->key: Ambience->ambience, Feeding->feeding. Keep openFirstAction name/sig (~51 call sites). Do NOT weaken assertions, do NOT touch product code. Broader sweep (~12 files, minus false positives like downtime-processing.spec.js) = separate tracking issue, NOT here. dt-form-34:165 is a DIFFERENT non-flat-wall failure. Branch morningstar-issue-602-feature96-flat-wall-repair off dev. Issue #602
  feature-608-contested-roll-pool-builder: review  # Contested roll widget (downtime-views.js:7990-8019). Two parts: (1) Opposing Char bare <select> (.proc-contested-char-sel :7998) -> _renderCharTypeahead single-mode (saveField contested_char; reconcile array vs scalar). (2) Resistance Pool free-text (.proc-contested-pool-input :8009) -> bespoke resistance-trait builder. DECISIONS (Angelus): typeahead chip for char; resistance pool built from resistance traits Resolve/Stamina/Composure (multi-select chips) + optional Blood Potency toggle, computed from the OPPOSING char's effective stats (getAttrEffective/getAttrBonus + blood_potency). Store contested_resist_traits[]+contested_resist_bp; derive contested_pool_label = "Resolve 3 + Blood Potency 2 = 5" (MUST end '= N' for the roll parser :6290). Gate on opposing char selected. Bespoke widget, NOT a refactor of the inline .proc-pool-builder. Extend the contested-off clear (:6251) to reset the new fields. Playwright per #586/#601 harness. Branch morningstar-issue-608-contested-roll-pool-builder off dev. Issue #608
  fix-609-player-herd-ssj-undercount: review  # Follow-up of #599. CORRECTED MID-DEV: effectiveDomainDots('Herd') ALREADY includes ssj+flock (meritEffectiveRating domain.js:265), so #599's herdDots+flockHerd DOUBLE-COUNTED flock (Flock chars showed +8 not +5). Fix: herdTotal = herdDots (no add) — corrects #609 (ssj already in) AND the #599 flock double-count; matches ST domMeritContrib. flockHerd kept for the (Flock)(+x) display only. dt-vitae-projection flakiness is pre-existing (A/B clean). Player Vitae Projection Herd total (downtime-form.js:7080 const herdTotal = herdDots + flockHerd) excludes ssjHerdBonus -> under-counts vs ST domMeritContrib. FIX: herdTotal = herdDots + flockHerd + ssjHerdBonus(c) (already imported, line 20). ssjHerdBonus (domain.js:111) = sum of MCI ratings iff Secret Society Junkie merit. DECISION: include SILENTLY (no "(SSJ)" label; Flock label path unchanged). Incremental, NOT domMeritContrib. Playwright per dt-form-599 harness (SSJ+MCI char -> total incl N; no-SSJ unchanged). Branch morningstar-issue-609-player-herd-ssj-undercount off dev. Issue #609

