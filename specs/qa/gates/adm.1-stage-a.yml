commit_provenance: >
  IMPORTANT, and a live instance of the workdir hazard the SM flagged. This review was dispatched
  against aa7e6c40, which `gh` reported as PR2's head, and all evidence below was gathered there.
  On completing the review I found PR2's branch tip was 5dc5cbab and that aa7e6c40 is NOT an ancestor
  of it — the branch had been REBASED under me mid-review, onto two new story commits (54184f3a
  Stage B revised per ADR-008 Rev 4 scope separation + dual gating; faf6dd64 AC-numbering collision
  fix). I re-verified rather than assuming: `git diff aa7e6c40 5dc5cbab -- public/` is EMPTY, so
  every product file is byte-identical between the commit I gated and the current tip, and all code
  verdicts carry over unchanged. What DID change is the story: Stage A AC1-3 are unchanged in
  substance (AC2 now names the 31-line delivery explicitly, which strengthens that verdict), but the
  invariants renumbered 11/12/13 -> 19/20/21 and Stage B grew from AC4-10 to AC4-18. This gate is
  re-based onto 5dc5cbab and its AC numbering corrected to Rev 4. Anyone reading a gate that cites
  AC11-13 as invariants is reading the pre-Rev-4 numbering.
  Also note the dispatch briefed me on ADR-008 Rev 3; Rev 4 exists and adds D9.
  SECOND PROVENANCE FINDING, on landing this gate — RESOLVED before this gate merged, recorded
  because the sequence is the lesson. At the time Stage A merged, the STORY file on dev was still
  Rev 3 while ADR-008 on dev was Rev 4. Commit 0d78620b merged the ADR alone (1 file, +47/-5); the Rev 4 story
  revisions (54184f3a, faf6dd64) live only on piatra/issue-1068-adm-p1-tickets and its sub-branches
  and did NOT reach dev through #1069/#1070. So dev currently carries a Rev 4 ADR beside a Rev 3
  story: no AC11-18, invariants still at AC11-13, and AC2 still says "28 dead rules" rather than
  naming the 31-line delivery. Because this gate may sit beside either version, every AC verdict
  below is labelled with BOTH numberings (Rev3 x / Rev4 y). The Stage A verdicts are unaffected by
  which one lands — AC1-3 are identical in substance in both revisions. Flagged for the SM: the
  story on dev was brought to Rev 4 first (PR #1072), and only then was this gate landed, so it sits
  beside the numbering it cites. Cause, per the SM: the Rev 4 story revisions were committed to the
  story branch AFTER the PR head branches had been pushed, and were never propagated to them; the
  rebase that carried them existed only in the dev's local worktree and never reached origin. Two
  branches, one of them local-only, and nobody checked which one the PRs pointed at. The dual AC
  labelling below is therefore belt-and-braces rather than load-bearing, and is retained
  deliberately at the SM's request.

