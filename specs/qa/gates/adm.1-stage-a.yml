notes:
  - >
    BOOT SMOKE WAS RUN WITH THE API UP, DELIBERATELY. Per usf.1-08(3) the harness's BENIGN console
    filter includes /Failed to load resource/, broad enough to swallow a stylesheet or module 404 —
    which is exactly the failure mode a delete-only change could produce. Running with the local API
    connected drove benignFiltered to 0 for both roles, so nothing was filtered and the clean result
    is not an artefact of the over-broad filter. I also confirmed the static server returns 404 for
    /js/tabs/tickets-tab.js on the PR2 tree, i.e. the delete really is being served.
  - >
    ON THE 31-vs-28 SCOPE ADDITION. Declared by the dev and approved by the SM before I saw it, and I
    agree with the reasoning independently: #t-tickets.active styles an id whose element dies in the
    same PR, so leaving it would strand a rule for a non-existent element — the exact condition D8
    exists to prevent. Worth recording that the declaration is what made this cheap to gate. An
    undeclared 31-vs-28 discrepancy would have read as possible collateral and forced me to
    reconstruct intent from the diff.
  - >
    THE DUAL-AUTHORING FINDING IS CORROBORATED, and I think it is the most consequential thing in
    this shard for the remaining 16 surfaces. My per-rule scan independently reproduces it: the
    classes emitted by admin/tickets-views.js are defined in admin-layout.css AND were defined in
    suite.css, separately, with different values, one authoring per document. The reason this matters
    for gating rather than only for design is that the usual reachability question — "is this rule
    dead?" — has a different answer per document, and a tree-wide grep cannot express that. Any
    emitter found in admin/ is irrelevant to whether a suite.css rule is dead, because the two
    documents never load each other's stylesheet. A reviewer who greps the tree and finds
    tickets-views.js emitting .tk-badge would wrongly conclude the suite.css .tk-badge rule is live.
    That is the same failure shape as the .map-* family-granularity error and as USF-1's usf.1-07:
    the measurement has to be scoped to the unit the decision applies to — here the DOCUMENT, not
    the repository.
  - >
    This is the fourth surface in this codebase found live-in-source and unreachable-in-fact
    (player.html, the 193 suite/player duplications, t-map #1067, now t-tickets). The third
    independent check was proportionate rather than paranoid, and I would keep doing it — but I would
    note that all three of us checked the same WAY (grep for the surface name). The generic-router
    class of route is the one a name-grep structurally cannot find, so if a fifth instance is checked,
    that is the check worth adding rather than a fourth pair of eyes on the same method.

recommendation: >
  PASS — Stage A can merge, and it can merge independently of the Stage B ruling. PR1 then PR2, in
  that order; PR2 is stacked on PR1 and must not be retargeted to dev before PR1 lands. The change is
  0 additions / 254 deletions, every load-bearing claim re-derives, all four invariants hold, no HALT
  condition triggered, and boot smoke is clean on both roles with nothing hidden by the console
  filter. On independence from Stage B: the Stage B question is which document should style the
  merged surface, and every answer to it — promote to components.css, a per-surface admin-tickets.css,
  or re-scope CSS to P2 — still requires suite.css's player-authored values to stop applying to
  admin markup. So these rules are deleted on every path. I reached that independently and it agrees
  with the dev's and the SM's reading. Stage B remains correctly halted and is not adjudicated here.
