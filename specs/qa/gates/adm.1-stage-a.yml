re_derivations:
  - id: "1. the surface really is unreachable"
    verdict: CONFIRMED
    method: >
      Checked against the PRE-PR1 tree (406b6d08^) via git grep, not against the post-deletion state,
      so the question asked is the one that matters: could anything reach #t-tickets BEFORE the
      dereference. Every case-insensitive 'tickets' occurrence in public/ (excluding tickets-tab.js
      itself, admin/, node_modules, and the scraped netlify mirror) resolves to exactly six things:
      admin.html's own separate Tickets domain (:60, :182-184) and admin.js's wiring for it (:42,
      :325) — a different surface entirely, untouched; the suite.css section being deleted; the
      index.html div being deleted; app.js:74 + :524-526, the two references PR1 removes; app.js:1564,
      the epitaph comment "Tickets removed — submit form is in Settings"; app.js:1812, the LIVE
      Settings POST; and the dev-fixtures/dt-proto-boot API mocks. No nav array entry, no More-grid
      entry, no hardcoded goTab('tickets'), no NAV_ALIAS entry.
    extension_beyond_prior_checks: >
      A literal 'tickets' grep cannot rule out a GENERIC router, which would reach the tab without
      ever naming it — so I checked that class separately, since it is the only way three independent
      reviewers could all miss the same route. Result: there is no hashchange, popstate,
      location.hash, or pathname-based tab routing anywhere in public/js. The only dynamic goTab call
      sites are template-interpolated from nav metadata — goTab('${app.id}') from MORE_APPS,
      goTab('${item.goTab}') from NAV_ITEMS, goTab('${id}') — plus goTab(currentTab). I enumerated
      both arrays programmatically: MORE_APPS has 18 ids, NAV_ITEMS 48 entries (25 distinct ids),
      and 'tickets' is in neither. goTab(currentTab) is the one that looked capable of it, but
      currentTab is derived at app.js:1065 from document.querySelector('.tab.active')?.id — it reads
      the tab that is ALREADY active from the DOM, not from localStorage or a URL, so it can only
      re-enter a tab something else already opened. It cannot introduce one.
    conclusion: >
      #t-tickets was unreachable through the UI. window.goTab is exposed at app.js:2371 so a console
      call would have rendered it, exactly as the story states; that is not a UI path. Note also the
      div was EMPTY in index.html — all content came from renderTicketsTab — so even a console call
      after PR1 and before PR2 would have produced a blank tab, which is precisely why the ADR-007 D8
      two-step ordering is the right one here even though nothing reached the module.
  - id: "2. the 31 deleted suite.css lines were all dead"
    verdict: CONFIRMED, per-rule
    method: >
      Deliberately NOT done at family granularity — ADR-008 D8 rule 4, which exists because a
      family-level sweep previously reported '11 dead .map-* rules' when only 1 was dead. Extracted
      the deleted lines from the PR2 diff and worked per RULE BLOCK, splitting every comma-group into
      its individual selectors. Line accounting reconciles the declared 31-vs-28: 1 section comment
      + 1 #t-tickets.active + 28 .tk-* rules + 1 trailing blank = 31. That is 29 rule blocks.
      For each block, extracted every tk- token and searched the whole tree with a true word boundary
      ((?<![\w-])tk-…(?![\w-])), which is what distinguishes tk-body from the Settings form's
      stk-body. Then classified each emitter by DOCUMENT reachability rather than mere existence,
      because suite.css is linked by index.html and by nothing else (verified: index.html:19-22 loads
      theme/layout/components/suite; admin.html:11-13 loads theme/components/admin-layout and never
      suite.css).
    result: >
      29 of 29 rule blocks have ZERO index-reachable emitters. No rule has a surviving emitter, so
      the HALT condition did not trigger. Independently confirms the dev's stronger claim: zero
      word-boundary tk- tokens remain in app.js post-PR2, and I extended that sweep across every
      index-reachable module (index.html, app.js, all of js/tabs/ and js/suite/) — all zero.
    the_apparent_exceptions_resolved: >
      Three sources emit these tokens and none is a reason to keep the suite copy.
      (a) public/js/admin/tickets-views.js and public/css/admin-layout.css — this is the dev's
      independent-dual-authoring finding and my scan reproduces it exactly: the same class names
      defined once per document, admin-side. They are emitted into admin.html, which never loads
      suite.css, so they cannot be styled by the deleted rules.
      (b) public/mockups/font-test.html — checked specifically rather than dismissed as a mockup. It
      is fully self-contained: its only <link> is the Google Fonts stylesheet and everything else is
      an inline <style> block. It never loads suite.css, so its tk- tokens are styled by its own
      inline CSS and are unaffected.
      (c) The Settings form's stk-* IDs — substring noise, excluded correctly by the word boundary.
  - id: "3. the Settings ticket form still works"
    verdict: CONFIRMED
    method: >
      Checked both halves, not just the wiring the story cites. WIRING at app.js:1799 (the story says
      :1807, the dev's record says :1807 after PR1's 5-line shift; it reads :1799 in the PR2 tree —
      an immaterial line-number drift, the code is identical and intact): binds #stk-submit and reads
      #stk-type, #stk-title, #stk-body, #stk-status, then awaits apiPost('/api/tickets', …). MARKUP at
      app.js:1737 emits the button as class="settings-btn" id="stk-submit" — I traced this
      deliberately, because if the form's markup had been emitted by the deleted tickets-tab.js the
      wiring would survive with nothing to bind to. It was not: the deleted tickets-tab.js contains
      zero stk- tokens. Both markup and wiring live in app.js, and PR2 does not touch app.js at all
      (its diffstat is suite.css, index.html, tickets-tab.js, story only), while PR1 touches only
      lines 74 and 524 — far from either site.
    result: >
      Form intact. Uses only #stk-* IDs, carries no .tk-* class (app.js has zero word-boundary tk-
      tokens post-PR2), POST /api/tickets still wired. AC3 satisfied.

