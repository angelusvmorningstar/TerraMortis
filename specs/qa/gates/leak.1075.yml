status_reason: >
  The leak is cut and the cut is measured: 2 modules / 214 KB -> 0 / 0, baseline blessed to an empty
  set, and the ratchet verified to re-tighten. Both dynamic specifiers are byte-identical, no static
  admin import remains, and no player or ST session fetches anything under public/js/admin/ on boot
  or across a tour of six tabs. PASS is on the change, which does what it claims and nothing else.
  It is NOT a report that AC8 was verified: the ST chronicle edit surface that AC8 exercises is
  UNREACHABLE in the shipped app, so the save round-trip cannot be performed by any user action and
  I have recorded it as not-exercisable rather than as passing. That finding is pre-existing and not
  caused by this PR, but it reframes the change — see leak1075-01, which is the most consequential
  thing here.

