schema: 1
story: "usf.1"
stage: "Phase 1 Tier 0 (byte-identical batch delete)"
story_title: "USF-1 — batch-delete the 110 byte-identical suite.css selector copies"
gate: CONCERNS
status_reason: >
  The CSS change is correct and I now judge it provably safe — more strongly than the dev record
  argued. Independent re-derivation confirms all three dev-asserted claims (zero mixed comma-groups,
  the .proj-card-dice shadowing argument, exact 1:1 deletion of the frozen 110) and the overlap gate
  re-runs at exactly 53. CONCERNS is NOT about the CSS. It is about AC3, the criterion the story
  itself calls "the pilot's real gate": the empty computed-style diff is recorded as satisfied on
  evidence covering 6 of 110 selectors for st and ZERO for player, where the player capture object is
  literally `computed: {}` — an empty-vs-empty comparison carrying no information. Recording that
  unqualified as a met AC is the "silent false green" ADR-007 D15 names. More consequentially, D14's
  stated purpose for Tier 0 is to VALIDATE the parity apparatus before tiers where a failure is
  ambiguous. The apparatus was not validated; it was shown inadequate for exactly the families
  (feeding/feed/fvc/fvt/regency/proj) that Tier 1-3 target. Tier 0 survives this because a complete
  structural proof substitutes for the missing parity evidence. Tier 1+ has no such substitute (see
  usf.1-02) and is currently ungateable. Merge is safe; Tier 1 must not open on this harness.
reviewer: "Ma'at (Test Architect)"
updated: "2026-07-29"
amended: "2026-07-29 (rev 2) — root-cause investigation of the coverage shortfall, prompted by Peter's
  report that the downtime families DO render on dev. Gate decision UNCHANGED (CONCERNS) and the Tier 0
  merge recommendation UNCHANGED. usf.1-01 and usf.1-02 are corrected: my original 'state-gated behind
  an active downtime submission' was directionally right but incomplete, and my remediation estimate
  was too expensive. Two NEW independent defects found (usf.1-04, usf.1-05). The recommendation to
  amend ADR-007 D15 is WITHDRAWN. See rev2_investigation."

waiver: { active: false }

top_issues:
  - id: usf.1-01
    severity: medium
    finding: >
      AC3 render coverage. Independently reproduced under the dev record's own conditions (local
      http-server + API on :3000, Atlas connected, real character data): st renders 5/89 leading
      classes, player renders 0/89. Both diffs are EMPTY, and I confirm that — but mapping the
      captured classes back to the frozen list, only 6 of the 110 Tier-0 SELECTORS have any computed
      evidence (.dt-hist-cycle, .dt-hist-entry, .dt-hist-entry-head, .dt-hist-outcome p,
      .dt-hist-outcome p:last-child, .dt-hist-panel). 104 have none. The player-role result is
      sharper than the dev record states: the capture payload is `computed: {}`, so "EMPTY diff for
      both roles" is one role contributing 6 selectors of evidence and one contributing zero, not two
      independent confirmations. The remaining families are state-gated behind an active downtime
      submission in a specific feeding/resolution phase, which goTab(feeding|downtime|story) does not
      create. Harness coverage limitation, NOT a CSS defect.
    recommendation: >
      Accept for Tier 0 (the structural proof below covers the 104) but qualify AC3 in the record
      rather than marking it plainly met. Raise the coverage work as its own issue and make it a
      prerequisite gate on Tier 1, per usf.1-02.
    amendment_rev2: >
      CORRECTION. Two factual errors in the finding above. (1) "Atlas connected, real character data"
      is WRONG for the character render path. public/js/dev-fixtures.js installs a window.fetch
      intercept for all /api/* calls whenever tm_auth_token === 'local-test-token' (app.js:1368), which
      is exactly the token the harness sets. Every character/cycle/submission read was served from
      fixtures; Atlas being up was irrelevant to what rendered. (2) The single cause
      ("state-gated ... which goTab does not create") is incomplete: the player 0/89 result has a
      SEPARATE and independent cause (usf.1-04) and the regency family has a third (usf.1-05). The
      coverage NUMBER is unchanged and independently re-confirmed: 6/110 selectors with evidence.
  - id: usf.1-02
    severity: high
    finding: >
      Tier 1+ is currently ungateable, and this is the pilot's real finding. Tier 0 tolerates a
      vacuous parity diff only because byte-identical bodies plus the cascade-order proof below make
      the deletions provably no-op WITHOUT rendering. Tier 1-3 are by definition DIVERGENT bodies, so
      no structural argument is available — computed-style parity is the ONLY gate those tiers have.
      That gate presently covers 0/89 of the feeding/feed/fvc/fvt/regency/proj families that Tier 1-3
      consist of. Running Tier 1 on this harness would produce an empty diff that looks like a pass
      and asserts nothing, against changes that DO alter declarations. This is strictly worse than
      having no gate, because it manufactures false confidence.
    recommendation: >
      SUPERSEDED by amendment_rev2 below. The conclusion (Tier 1 must not be drafted against the
      current harness) STANDS. The remediation shape and cost are corrected, and the ADR-007 D15
      amendment recommendation is WITHDRAWN.
    amendment_rev2: >
      CORRECTION to cost and scope; conclusion unchanged. I recommended "build a state-seeding
      harness" and "escalate to Architect as a scope addition to ADR-007 D15". Both were too
      expensive. Root-cause investigation shows the apparatus DOES reach these surfaces — the feeding
      tab mounts correctly under goTab('feeding') and renders its own gate message. What is wrong is
      FIXTURE DATA plus two harness constants, not the D15 design. NO ADR AMENDMENT IS NEEDED; D15's
      apparatus is sound. Corrected remediation, in order of cost:
        (a) usf.1-04 — replace the dead hardcoded character id (one constant, and the same fix in
            public/dev-login.html:64-65).
        (b) usf.1-05 — add 'regency' to the harness default surfaces list (one constant).
        (c) The real one — extend public/js/dev-fixtures.js so the newest LIVE cycle has a submission.
            DT_CYCLES already contains an open cycle (dev0000000000000000000dt3, "Downtime 3",
            status:'open') and DT_SUBS already exists with a full feeding shape, but all 3 submissions
            are attached to cycle 69d0a3c5052b57f6be774e69 ("Downtime 2", status:'closed'). The #537
            guard at feeding-tab.js:141 requires candidateSub.cycle_id === newestLiveCycle._id, so
            with submissions on a CLOSED cycle and the newest live cycle empty, activeCycle resolves
            null and the entire feeding render() is replaced by the placeholder. Adding one DT_SUBS
            entry on the open cycle for the harness's character, carrying feeding_roll_player (or
            published_outcome / feeding_deferred), unblocks the feeding/feed/fvt families. This is a
            dev-fixture data edit in a file that already intercepts the right endpoints — NOT a
            harness build and NOT a product-code change.
      Residual after (a)-(c), which fixture data alone cannot reach: `.feeding-disc-row` requires a
      method-card CLICK (selectedMethodId, feeding-tab.js:651) and the `.fvc-*` vessel family requires
      a COMPLETED roll. Those need scripted interaction in the harness, not just seeded state. So the
      corrected plan is: two constants + a fixture row (cheap, unblocks most), then scripted
      interaction for the interaction-gated remainder. Tier 1 entry should gate on measured coverage
      of the specific selectors that Tier 1 shard touches — not on a blanket "harness rebuilt".
  - id: usf.1-03
    severity: low
    finding: >
      usf-smoke.mjs reports an empty capture as success. A run with `computed: {}` exits 0 and its
      diff against another empty capture is empty, which is indistinguishable at the CI level from a
      genuine full-coverage parity pass. The harness already tracks classesRequested/classesRendered,
      so the signal exists and is simply not gated on.
    recommendation: >
      Add a coverage floor to the harness (e.g. --min-rendered N, non-zero exit when unmet) so a
      vacuous capture cannot be mistaken for a parity pass. Fold into the usf.1-02 harness work; do
      not fix in this story.

  - id: usf.1-04
    severity: medium
    added: "rev 2"
    finding: >
      Dead character fixture id in the harness — fully accounts for player 0/89, independently of any
      state gating. usf-smoke.mjs:68 hardcodes character_ids: ['600000000000000000000006'] (copied
      from public/dev-login.html:64-65). That OID comes from the nav.1 anonymised fixture set (Elara
      Voss). public/js/dev-fixtures.js was REGENERATED 2026-04-19 from a live Atlas export and now
      carries 31 characters with real OIDs; 600000000000000000000006 is NOT among them (verified: 0
      occurrences in the file). The player app filters chars by character_ids (app.js:777, :1597), so
      it authenticates as owning a character that does not exist and renders nothing — computed:{}.
      CONFIRMED by experiment: substituting a real fixture id (69d720427fdd1b1f9498b0d4, Yusuf
      Kalusicj) takes player from 0 to 5 rendered classes. Note this raises player to PARITY with st,
      it does not add new classes — the coverage ceiling of 6/110 selectors is unchanged.
      public/dev-login.html:64-65 carries the same dead id, so manual dev login as a player is
      affected too. That is a product-side dev-tooling bug found incidentally; not a USF-1 regression.
    recommendation: >
      Fix the id in both usf-smoke.mjs and public/dev-login.html, and prefer deriving it from
      dev-fixtures.js rather than hardcoding a third copy. Cheap and independent of the fixture work.
  - id: usf.1-05
    severity: low
    added: "rev 2"
    finding: >
      The harness default surfaces list is 'feeding,downtime,story' (usf-smoke.mjs:42), but the
      regency family renders in public/js/tabs/regency-tab.js behind the t-regency tab, which is never
      visited. The 3 regency-* Tier-0 selectors therefore cannot render regardless of fixture state.
      Similarly .proj-card-* renders from story-tab.js and feeding-tab.js, both of which ARE visited,
      so those are fixture/state-gated rather than surface-gated.
    recommendation: "Add 'regency' to the default surfaces list. One constant."

