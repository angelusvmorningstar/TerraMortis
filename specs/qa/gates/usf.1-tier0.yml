ac_verdicts:
  - ac: 1
    text: "The 110 Tier-0 selectors have their suite.css rule copy removed; components.css copy unchanged"
    verdict: PASS
    evidence: >
      Re-parsed pre-delete suite.css (git show c5e69f30^) and post-delete suite.css with
      css-overlap.py's own parser. 1573 -> 1461 rule blocks (delta 112). Selector-occurrence diff:
      110 keys lost occurrences, 112 occurrences removed total, 0 keys gained. Collateral (removed
      but not on the frozen list) = 0. Survivors (on the list but not removed) = 0. Partially-removed
      selectors = 0. Declaration bodies of SURVIVING rule heads changed = 0. New rule heads = 0.
      Exact 1:1 onto the frozen list, no over- or under-deletion.
  - ac: 2
    text: "usf-overlap-gate.py --expect 53 PASSES; --max 163 PASSES"
    verdict: PASS
    evidence: "QA re-ran both: `overlap=53 expected=53 -> PASS` (exit 0) and `overlap=53 max=163 -> PASS` (exit 0). css-overlap.py --count = 53."
