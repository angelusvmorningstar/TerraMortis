notes:
  - >
    CASCADE-ORDER PROOF (QA addition; this is what actually carries the 104 selectors with no parity
    evidence). css-overlap.py's own docstring warns that byte-identical bodies do NOT by themselves
    prove a no-op delete: "an equal-specificity rule sitting between the two copies in cascade order
    can change the computed value on a co-occurring class." The dev record rests the 104 on
    byte-identity alone, which is insufficient by the instrument's own stated limit. I closed the gap
    with two checks. Load order is theme < layout < components < suite (index.html 19-22), so
    deleting suite's copy hands the win to components' copy, and that is a no-op only if
    (1) no two deleted rules that can match the same element at equal specificity with conflicting
    properties have their relative order INVERTED between the two files, and
    (2) no surviving suite rule PRECEDED a deleted rule (such a rule lost before, but would win after,
    since it stays in the later file while its competitor falls back to the earlier one).
    Check 1: 0 inversions across all co-occurring, equal-specificity, conflicting Tier-0 pairs.
    Check 2: 33 raw candidates, all resolved to unreachable. Most were my own heuristic being
    deliberately conservative on bare-element keys (a `button` and a `label` cannot be one element).
    The genuine same-element candidates were resolved against the markup: `.fvt-pos`/`.fvt-neg`/
    `.fvt-total` are mutually exclusive on a row (feeding-tab.js:563-575; the total row is
    `class="fvt-row fvt-total"`, never fvt-pos), and `.primer-content` / `.story-narrative` /
    `.proj-card-response` / `.dt-hist-outcome` / `.st-dt-field` / `.feeding-disc-row` are distinct
    tab-level container roots that never nest. Check 2b: 23 @media blocks precede the last deleted
    rule; none mentions any Tier-0 class. Conclusion: computed values are unchanged for all 110
    regardless of whether they render. The shard is safe on structure, not on the parity diff.
  - >
    .proj-card-dice divergent-copy claim (SM re-derivation item 2) — CONFIRMED, with the load-bearing
    detail the record left implicit. Pre-delete there were two suite copies: #629
    `{font-family:var(--fl); font-size:11px; color:var(--txt3); margin-top:2px}` and #913
    `{font-family:monospace; font-size:11px; color:var(--txt3); word-break:break-all; margin-top:4px}`,
    with components #1380 byte-identical to #913. Both suite copies are specificity (0,1,0), so the
    later one (#913) governed. The claim "already fully shadowed" holds ONLY because #629's property
    set is a strict SUBSET of #913's: {font-family, font-size, color, margin-top} vs
    {font-family, font-size, color, word-break, margin-top}. Every property #629 declared is
    re-declared by #913, so nothing leaked through. Had #629 carried even one property absent from
    #913, that property WOULD have applied pre-delete and its removal would have been a real
    behavioural change. It does not, so the delete is a genuine no-op: governed by #913 before, by
    the byte-identical components #1380 after. Verified the same subset condition for the other
    duplicated selector, .feeding-state-detail (suite #895 {font-size:13px;color:var(--txt3)} shadowed
    by #990 {font-size:14px;color:var(--txt2);margin-bottom:16px}; both mirrored in components at
    #1362/#1457 in the same relative order). Dev record accurate on both.
  - >
    Neither HALT-DAR condition tripped: the computed-style diff is empty on every captured class (no
    non-empty diff anywhere), and the overlap gate returns exactly 53. Re-derivation of SM items 1
    and 2 CONFIRMS the dev record rather than contradicting it, so the third HALT condition is also
    clear. Proceeding with notice as instructed.
  - >
    Env reproduction note: the story's env caveat is real and cost setup time here too. server/index.js
    (not server.js) is the entrypoint, and config.js resolves .env from the repo root while the file
    lives at server/.env, so the API must be launched as
    `cd server && PORT=3000 node --env-file=.env index.js`. Not a story defect; worth folding into the
    harness README so the next reviewer does not rediscover it.

recommendation: >
  CONCERNS — merge to dev is safe and I recommend it. The deletion is exact (110/110, zero collateral,
  zero survivors), the overlap gate is machine-confirmed at 53, boot health is unchanged for both
  roles, no write path or ADR-004 surface is touched, and the cascade-order proof establishes the
  no-op independently of rendering. The gate is CONCERNS rather than PASS because a PASS would record
  AC3 — the story's own "real gate" — as satisfied by evidence covering 6 of 110 selectors, with the
  player role contributing an empty-vs-empty comparison. That is the precise shape of the false green
  D15 exists to prevent, and it should be visible in the record rather than smoothed into a pass.
  Tier 0 did its D14 job: it validated the DELETION method and falsified the PARITY APPARATUS, which
  is the more valuable result and exactly why the pilot was run first. Blocking follow-up: Tier 1
  must not be drafted against this harness (usf.1-02, high) — divergent-body tiers have no structural
  fallback, so a harness that renders 0/89 of their families would gate them on nothing while
  appearing to pass. Recommend a separate issue for seeded-state capture plus a coverage floor
  (usf.1-03), gating Tier 1 entry, and an Architect note that ADR-007 D15's apparatus as specified
  does not reach the surfaces D10's tiering targets.
