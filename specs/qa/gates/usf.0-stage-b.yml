story_title: "USF-0 — Correct the map: retire the dead player path, tracker hygiene, freeze the write-path inventory"
gate: PASS
status_reason: >
  Stage B is a minimal, provably-safe deletion. Commit 5fdaa032 removes exactly the three dead
  files (public/player.html, public/js/player.js, public/css/player-layout.css) and nothing else
  product-side, plus the one-line cosmetic fix to suite/toast.js:13 (app.js:109 -> app.js:132,
  resolving usf.0a-01) and story bookkeeping. Stage A (58c88b5b) is confirmed an ancestor of this
  branch, so the dereference is in history and the files are genuinely unreachable at delete time.
  The reachability grep confirms zero live references to the deleted files remain: every hit is
  either a comment or one of the two behavioural path-guards (admin.js:406 `path !== '/player'`,
  helpers.js:21 `startsWith('/player')`) — both runtime pathname string-comparisons, not file
  references or navigable links; leaving them inert is correct for Phase 0. The boot-smoke harness
  passes for BOTH roles (pass:true, pageErrors:[], meaningfulConsoleErrors:[]; the 9-10 filtered
  entries are the expected no-local-backend connection noise). D7 write-path invariant holds
  trivially — admin.js is not in the commit at all, so no frozen write site is touched. DOM parity
  is moot: only never-loaded files were deleted, so no rendering change is possible. Phase 0 is
  complete on dev across both stages.
reviewer: "Ma'at (Test Architect)"
updated: "2026-07-28"

waiver: { active: false }

top_issues:
  - id: usf.0b-01
    severity: low
    finding: >
      Two path-guards now reference a route (/player) that no longer exists, making them
      dead-but-inert conditionals: admin.js:406 `if (path !== '/player')` is now always true (so
      the Player button always renders on the admin page — the correct behaviour, since admin is
      never served at /player), and helpers.js:21 `startsWith('/player')` is now always false (the
      dev-redaction guard simply falls through to its other checks, incl. the tm_view_mode ===
      'player' branch). Neither errors; both are harmless. This is expected and explicitly in-scope-
      to-leave per the story (Phase 0 is delete-only; guard simplification is a later cleanup).
    recommendation: >
      No action for Phase 0. A future USF hygiene pass can drop the now-unreachable /player branches
      from these two guards. Logged only so the next reviewer knows they are intentionally inert,
      not overlooked live references.
  - id: usf.0b-02
    severity: low
    finding: >
      A handful of comments still mention player.html / player-layout.css / player/status-tab.js
      (e.g. downtime-tab.js:94 "at /player, which is now a legacy stub", components.css / suite.css
      "ported from player-layout.css", suite/status.js:3 "Ported from public/js/player/status-tab.js").
      These are prose, not references, and the story explicitly scopes comment-chasing out ("comments
      are not references; a later doc-hygiene pass can update"). downtime-tab.js:94 is now slightly
      stale (the stub it describes is deleted).
    recommendation: >
      No action for Phase 0. Fold into the deferred doc-hygiene pass the story already anticipates.

