recommendation: >
  PASS — safe to merge Stage B to dev. Deletions are minimal and provably safe (Stage A dereference
  in history, zero live references, boot smoke clean both roles), no write path touched, ADR-007 D8
  two-step honoured, cosmetic usf.0a-01 resolved. With this merged, Phase 0 is complete on dev across
  both stages and ready for prod promotion. Two low doc/guard-hygiene items (usf.0b-01/02) are
  explicitly deferred by the story and are not blockers. Merge + prod-promotion cadence is the SM's /
  Peter's call.
