    - "grep for residual .bonus= writes in touched files — only merit channel (out of scope)"
    - "app.js scope check — getRole/editorState/editorRenderSheet/suiteState/getGlobalSettings/materialiseDerivedDefence/applyOverlayToAll all imported"
    - "theme.css — --gold2 and --txt-on-gold defined (light+dark)"
