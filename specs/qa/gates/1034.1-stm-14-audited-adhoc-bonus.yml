browser_smoke_required:
  - "AC1: apply affordance click → reason-required modal → empty reason blocked → POST creates mod → marker appears"
  - "AC3: marker popover opens on the ADMIN/ST sheet and shows base/adjustment/final + reason (see issue 1034.1-01 — predicted to FAIL pre-existing; confirm)"
  - "AC4: st-mods panel deactivate drops the total + records a 'deactivated' audit event; reactivate restores"
  - "AC5 regression check: edit mode — no +○/−○ controls; base dots still edit; overlay reapplies on exit"

recommendation: >
  Safe to merge to dev. No regression, no new defect, all seven ACs pass on static trace with
  ADR-004 invariants intact. Two follow-ups (advisory, not blocking): run the 6-step manual browser
  smoke, and browser-confirm the pre-existing marker-popover resolution gap (issue 1034.1-01) — if it
  fails on the ST sheet, file it as a separate STM defect rather than expanding 1034.1. Merge gate is
  Khepri's / Peter's call.
