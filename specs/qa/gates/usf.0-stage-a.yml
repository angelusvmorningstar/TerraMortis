status_reason: >
  Stage A is a clean, scope-disciplined dereference-and-hygiene change with zero behavioural
  risk. All four live player-path links (admin.js:283, :406, :659, dev-login.html:45) are
  repointed to "/"; the netlify /player redirect block and the stale public/_redirects gate are
  gone; a full reachability grep confirms no live href/value to the /player route or player.html
  remains (only comments and the stub's own internal <link>/<script> survive, correct for Stage A).
  The CRITICAL D7 write-path invariant holds absolutely: the admin.js diff contains ONLY the three
  href repoints — none of the frozen write sites (945/1001/1020/1226/836, downtime-form.js:1166,
  feeding-tab.js/story-tab.js) is touched. The tracker rename is a real git rename (R097); the sole
  export is `toast`; the app.js:132 importer is updated; no dangling suite/tracker import remains;
  and both preserved guards — helpers.js:21 startsWith('/player') redaction guard and suite/sheet.js:348
  legacy-cache migration (D6) — are untouched. usf-write-path-inventory.md reproduces ADR-007 D7
  verbatim. CLAUDE.md:150 is corrected. player.html/js/css still exist (Stage-B deletion correctly
  deferred, D8 two-step). ADR-004 cache-entry invariant is untouched (no boot-overlay / stash-path
  change). node --check clean on all three JS files. The only open items are AC7 DOM parity and the
  boot smoke, which the story's own D8 two-step defines as dev-deploy checks — flagged pending-dev-
  deploy below, and gating for Stage B opening rather than for this gate.
