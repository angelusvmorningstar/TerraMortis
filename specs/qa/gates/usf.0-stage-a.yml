top_issues:
  - id: usf.0a-01
    severity: low
    finding: >
      The new public/js/suite/toast.js module header (line 13) still says the `toast` export is
      "kept here so app.js:109's import path is unchanged" — but the actual importer is app.js:132
      (the module's old file-header line number was stale; the story's own Completion Notes and
      File List correct it to :132). So the renamed module's header now carries the same stale
      :109 reference the story flagged and fixed elsewhere. Purely cosmetic — no functional effect;
      the import path itself (`./suite/toast.js`) is correct and node --check passes.
    recommendation: >
      Optional one-word fix: update the toast.js header ":109" to ":132" (or drop the line number)
      for internal consistency with the story record. Not a merge blocker; can ride the Stage B PR.

  - id: usf.0a-02
    severity: low
    finding: >
      Finding-delta accepted (not a defect, logged for the record): admin.js:283 (the is_dual_role
      "My Character" sidebar link) was a FOURTH live /player reference the story's reachability
      evidence did not enumerate (it named three). Ptah repointed it to "/" and flagged it for
      Architect review with a one-line revert offer. This is the correct call and is in fact
      NECESSARY: because this same commit removes the netlify /player redirect, an un-repointed
      relative href="player" would resolve to /player and fall through the SPA catch-all to the
      unified app at a stray URL. Repointing to "/" is both behaviour-preserving (old chain
      player -> /player -> redirect -> stub -> replace('/') also landed on /) and cleaner.
    recommendation: >
      No change needed. Architect to confirm the dual-role "My Character" affordance is content to
      land on "/" alongside the general Player link (it does today); if a distinct dual-role
      destination is ever wanted, that is a separate behavioural story, not this dereference.

