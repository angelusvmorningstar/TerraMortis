[build]
  publish = "public"

# Short cache for JS/CSS so deploys take effect quickly
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Proxy API requests to the Render-hosted Express server.
# Update the 'to' URL when the Render service is deployed.
[[redirects]]
  from = "/api/*"
  to = "https://tm-suite-api.onrender.com/api/:splat"
  status = 200
  force = true

# ═══════════════════════════════════════════════════════════════════════════
# MAINTENANCE MODE — ecosystem rebrand in progress (2026-08-21). Comment out or
# delete this block to restore normal service. Sits after the API proxy (so
# /api/* still works, e.g. for verification during the rebrand) but before
# every other route, so everything else shows the maintenance page. See
# ../rebrand-game-story-admin.md for status.
# ═══════════════════════════════════════════════════════════════════════════
[[redirects]]
  from = "/*"
  to = "/maintenance.html"
  status = 503
  force = true

# Block dev-login in production — only meaningful locally
[[redirects]]
  from = "/dev-login"
  to = "/dev-login.html"
  status = 404

# Named entry points — serve the correct HTML for each app
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# SPA fallback — serve index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
