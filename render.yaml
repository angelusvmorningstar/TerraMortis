services:
  - type: worker
    name: tm-game-bot
    runtime: node
    plan: free
    rootDir: bot
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_BOT_TOKEN
        sync: false  # set manually in Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        value: 1516048999365218314
      - key: DISCORD_GUILD_ID
        sync: false  # set manually in Render dashboard
      - key: TM_API_URL
        value: https://tm-game-api.onrender.com
      - key: ANNOUNCE_DEVLOG_CHANNEL_ID
        sync: false
      - key: ANNOUNCE_DOWNTIME_CHANNEL_ID
        sync: false
      - key: ANNOUNCE_GAME_CHANNEL_ID
        sync: false

  - type: web
    name: tm-game-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false  # set manually in Render dashboard (secret)
      - key: DISCORD_CLIENT_ID
        value: 1488404820917223484
      - key: DISCORD_CLIENT_SECRET
        sync: false  # set manually in Render dashboard (secret)
      - key: DISCORD_REDIRECT_URI
        sync: false  # set manually once Netlify domain is known
      - key: CORS_ORIGIN
        sync: false  # set manually once Netlify domain is known
      - key: ST_IDS
        value: 694104767298797618,977695064392343652,405594065841946624
